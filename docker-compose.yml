services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: crediticio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en un archivo .env local}
    ports:
      - "5433:5432"
    volumes:
      - crediticio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crediticio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crediticio_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: crediticio
      DEMO_SEED_ENABLED: "false"
      SERVICIO_DATOS_URL: ${SERVICIO_DATOS_URL:-http://host.docker.internal:8081}
    depends_on:
      db:
        condition: service_healthy

volumes:
  crediticio_data:
