<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración crediticia</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-primary px-4"><a class="navbar-brand" th:href="@{/dashboard}">Sistema Crediticio · Administración</a><a class="btn btn-sm btn-outline-light" th:href="@{/logout}">Salir</a></nav><main class="container py-4"><div class="d-flex gap-2 mb-4 flex-wrap"><a class="btn btn-outline-secondary" th:href="@{/politicas}">Políticas</a><a class="btn btn-outline-secondary" th:href="@{/tipos-credito}">Tipos de crédito</a><a class="btn btn-outline-secondary" th:href="@{/politicas/auditoria}">Auditoría</a></div>
<h1 class="h3" th:text="${tipo.id == null ? 'Nuevo tipo de crédito' : 'Editar tipo de crédito'}">Tipo</h1>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/tipos-credito/guardar}" method="post" class="card p-4 shadow-sm" th:object="${tipo}" data-json-api="/api/v1/tipos-credito" data-json-id-field="id" data-json-redirect="/tipos-credito">
<input type="hidden" name="id" th:value="${tipo.id}">
<div class="mb-3"><label class="form-label">Código único sin espacios</label><input class="form-control" name="codigo" maxlength="40" pattern="[A-Za-z][A-Za-z0-9_-]{2,39}" th:readonly="${tipo.id != null}" th:value="${tipo.codigo}" placeholder="Agrario" required></div>
<div class="mb-3"><label class="form-label">Nombre visible al cliente</label><input class="form-control" name="nombre" maxlength="100" th:value="${tipo.nombre}" placeholder="Crédito agrario" required></div>
<div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" rows="3" name="descripcion" maxlength="350" th:text="${tipo.descripcion}"></textarea></div>
<label class="form-check mb-3"><input class="form-check-input" type="checkbox" name="activo" value="true" th:checked="${tipo.activo}"><span class="form-check-label">Tipo activo (requiere una política activa para ofrecerse)</span></label>
<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar tipo</button><a class="btn btn-outline-secondary" th:href="@{/tipos-credito}">Cancelar</a></div>
</form></main><script th:src="@{/js/json-forms.js(v=2)}" defer></script></body></html>
