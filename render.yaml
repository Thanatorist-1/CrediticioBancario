services:
  - type: web
    name: crediticio-bancario
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /login
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SERVICIO_DATOS_URL
        sync: false
