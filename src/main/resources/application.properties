server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crediticio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:crediticio}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# API ficticia externa; HTTP local, configurable con variable de entorno.
servicio.datos-simulados.url=${SERVICIO_DATOS_URL:http://localhost:8081}

# SOLO DEMOSTRACIÓN: al iniciar, verifica 50 DNI en API externa y crea cuentas + solicitudes reales.
# Poner DEMO_SEED_ENABLED=false para no crear datos de prueba.
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.count=${DEMO_SEED_COUNT:50}

# Configuración exclusiva para crear la primera cuenta Administrador. No imprimir secretos en el log.
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
