<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/><title>Solicitud - Sistema Crediticio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link th:href="@{/css/style.css}" rel="stylesheet"/>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid"><a class="navbar-brand" th:href="@{/dashboard}">Sistema Crediticio</a></div>
        </nav>
        <div class="container-fluid">
            <div class="row">
                <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
                    <h5 class="text-white mb-4">Menú</h5>
                    <div class="d-grid gap-2">
                        <a class="btn btn-dark text-start" th:href="@{/dashboard}">Dashboard</a>
                        <a class="btn btn-dark text-start" th:href="@{/clientes}">Clientes</a>
                        <a class="btn btn-primary text-start" th:href="@{/solicitudes}">Solicitudes</a>
                        <a class="btn btn-dark text-start" th:href="@{/evaluaciones}">Evaluaciones</a>
                        <a class="btn btn-dark text-start" th:href="@{/politicas}">Políticas</a>
                        <a class="btn btn-dark text-start" th:href="@{/usuarios}">Personal del banco</a>
                        <a class="btn btn-dark text-start" th:href="@{/reportes}">Reportes</a>
                        <a class="btn btn-danger text-start mt-4" th:href="@{/login}">Cerrar sesión</a></div>
                </aside>
                <main class="col-md-9 col-lg-10 p-4">
                    <h2 th:text="${solicitud.idSolicitud == null ? 'Nueva solicitud' : 'Editar solicitud'}">Nueva solicitud</h2>
                    <p class="text-muted">Completa los datos del crédito para guardarlos en PostgreSQL.</p>
                    <form class="card card-body shadow-sm" th:object="${solicitud}" th:action="@{/solicitudes/guardar}" method="post">
                        <input type="hidden" th:field="*{idSolicitud}"/>
                        <input type="hidden" th:field="*{codigo}"/>
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="idCliente">Cliente</label>
                                <select id="idCliente" class="form-select" th:field="*{idCliente}" required>
                                    <option value="">Seleccione un cliente</option>
                                    <option th:each="cliente : ${clientes}" th:value="${cliente.idCliente}" th:text="${cliente.nombre + ' — ' + cliente.dni}">
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('idCliente')}" th:errors="*{idCliente}">
                                </div>
                                <div class="form-text" th:if="${#lists.isEmpty(clientes)}">Registra primero un cliente.</div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="tipoCredito">Tipo de crédito</label>
                                <select id="tipoCredito" class="form-select" th:field="*{tipoCredito}" required>
                                    <option value="">Seleccione</option>
                                    <option value="Personal">Personal</option>
                                    <option value="Vehicular">Vehicular</option>
                                    <option value="Hipotecario">Hipotecario</option>
                                    <option value="Emprendimiento">Emprendimiento</option>
                                    <option value="Educativo">Educativo</option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tipoCredito')}" th:errors="*{tipoCredito}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="monto">Monto solicitado (S/)</label>
                                <input id="monto" class="form-control" type="number" min="500" step="0.01" th:field="*{monto}" required/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('monto')}" th:errors="*{monto}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="plazoMeses">Plazo (meses)</label>
                                <input id="plazoMeses" class="form-control" type="number" min="1" th:field="*{plazoMeses}" required/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('plazoMeses')}" th:errors="*{plazoMeses}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="fecha">Fecha</label>
                                <input id="fecha" class="form-control" type="date" th:field="*{fecha}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="ingresosMensuales">Ingresos mensuales</label>
                                <input id="ingresosMensuales" class="form-control" type="number" min="0" step="0.01" th:field="*{ingresosMensuales}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('ingresosMensuales')}" th:errors="*{ingresosMensuales}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="gastosMensuales">Gastos mensuales</label>
                                <input id="gastosMensuales" class="form-control" type="number" min="0" step="0.01" th:field="*{gastosMensuales}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('gastosMensuales')}" th:errors="*{gastosMensuales}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="deudasMensuales">Deudas mensuales</label>
                                <input id="deudasMensuales" class="form-control" type="number" min="0" step="0.01" th:field="*{deudasMensuales}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('deudasMensuales')}" th:errors="*{deudasMensuales}">
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="estado">Estado</label>
                                <select id="estado" class="form-select" th:field="*{estado}">
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="En evaluación">En evaluación</option>
                                    <option value="Revisión manual">Revisión manual</option>
                                    <option value="Aprobada">Aprobada</option>
                                    <option value="Rechazada">Rechazada</option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}">
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="motivo">Motivo</label>
                                <input id="motivo" class="form-control" th:field="*{motivo}" maxlength="250"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}">
                                </div>
                            </div>
                            <div class="col-12"><label class="form-label" for="observaciones">Observaciones</label>
                                <textarea id="observaciones" class="form-control" rows="3" th:field="*{observaciones}" maxlength="1000">
                                </textarea>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}">
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button class="btn btn-primary" type="submit" th:disabled="${#lists.isEmpty(clientes)}">Guardar solicitud</button>
                            <a class="btn btn-secondary" th:href="@{/solicitudes}">Cancelar</a></div>
                    </form>
                </main>
            </div>
        </div>
    </body>
</html>
