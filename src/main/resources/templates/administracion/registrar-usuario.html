<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/><title>Usuario interno</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link th:href="@{/css/style.css}" rel="stylesheet"/>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid"><a class="navbar-brand" th:href="@{/dashboard}">Sistema Crediticio</a></div>
        </nav>
        <main class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 th:text="${usuario.idUsuario == null ? 'Registrar usuario interno' : 'Editar usuario interno'}">Usuario interno</h2>
                    <p class="text-muted mb-0">Ingresa los datos institucionales del trabajador.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver</a></div>
            <div class="alert alert-info">Este registro aún no habilita credenciales; la autenticación corresponde a una etapa posterior.</div>
            <form class="card shadow-sm" th:object="${usuario}" th:action="@{/usuarios/guardar}" method="post">
                <div class="card-body">
                    <input type="hidden" th:field="*{idUsuario}"/>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label" for="nombreCompleto">Nombre completo</label>
                            <input id="nombreCompleto" class="form-control" th:field="*{nombreCompleto}" maxlength="120" required/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}">
                            </div>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="correo">Correo institucional</label>
                            <input id="correo" class="form-control" type="email" th:field="*{correo}" maxlength="180" placeholder="nombre@banco.com" required/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">
                            </div>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="cargo">Cargo</label>
                            <input id="cargo" class="form-control" th:field="*{cargo}" maxlength="100"/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('cargo')}" th:errors="*{cargo}">
                            </div>
                        </div>
                        <div class="col-md-3"><label class="form-label" for="rol">Rol</label>
                            <select id="rol" class="form-select" th:field="*{rol}">
                                <option value="Analista">Analista</option>
                                <option value="Supervisor">Supervisor</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}">
                            </div>
                        </div>
                        <div class="col-md-3"><label class="form-label" for="estado">Estado</label>
                            <select id="estado" class="form-select" th:field="*{estado}">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <button class="btn btn-primary" type="submit">Guardar usuario</button>
                    <a class="btn btn-outline-secondary ms-2" th:href="@{/usuarios}">Cancelar</a></div>
            </form>
        </main>
    </body>
</html>
