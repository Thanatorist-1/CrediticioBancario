<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/><title>Cliente - Sistema Crediticio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link th:href="@{/css/style.css}" rel="stylesheet"/>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid"><a class="navbar-brand" th:href="@{/dashboard}">Sistema Crediticio</a></div>
        </nav>
        <div class="container-fluid">
            <div class="row">
                <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
                    <h5 class="text-white mb-4">Menú</h5>
                    <div class="d-grid gap-2">
                        <a class="btn btn-dark text-start" th:href="@{/dashboard}">Dashboard</a>
                        <a class="btn btn-primary text-start" th:href="@{/clientes}">Clientes</a>
                        <a class="btn btn-dark text-start" th:href="@{/solicitudes}">Solicitudes</a>
                        <a class="btn btn-dark text-start" th:href="@{/evaluaciones}">Evaluaciones</a>
                        <a class="btn btn-dark text-start" th:href="@{/politicas}">Políticas</a>
                        <a class="btn btn-dark text-start" th:href="@{/usuarios}">Personal del banco</a>
                        <a class="btn btn-dark text-start" th:href="@{/reportes}">Reportes</a>
                        <a class="btn btn-danger text-start mt-4" th:href="@{/login}">Cerrar sesión</a></div>
                </aside>
                <main class="col-md-9 col-lg-10 p-4">
                    <h2 th:text="${cliente.idCliente == null ? 'Nuevo cliente' : 'Editar cliente'}">Cliente</h2>
                    <p class="text-muted">Completa los datos personales y financieros.</p>
                    <form class="card card-body shadow-sm" th:object="${cliente}" th:action="@{/clientes/guardar}" method="post">
                        <input type="hidden" th:field="*{idCliente}"/>
                        <input type="hidden" th:field="*{codigo}"/>
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="nombre">Nombre completo</label>
                                <input id="nombre" class="form-control" th:field="*{nombre}" required minlength="2" maxlength="120"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="dni">DNI</label>
                                <input id="dni" class="form-control" th:field="*{dni}" required inputmode="numeric" maxlength="8" pattern="[0-9]{8}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}">
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                                <input id="fechaNacimiento" class="form-control" type="date" th:field="*{fechaNacimiento}"/>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="telefono">Teléfono</label>
                                <input id="telefono" class="form-control" th:field="*{telefono}" inputmode="numeric" maxlength="9" pattern="[0-9]{9}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="correo">Correo electrónico</label>
                                <input id="correo" class="form-control" type="email" th:field="*{correo}" maxlength="150"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="direccion">Dirección</label>
                                <input id="direccion" class="form-control" th:field="*{direccion}" maxlength="180"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}">
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="estado">Estado</label>
                                <select id="estado" class="form-select" th:field="*{estado}">
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="empresa">Empresa</label>
                                <input id="empresa" class="form-control" th:field="*{empresa}" maxlength="120"/>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="cargo">Cargo</label>
                                <input id="cargo" class="form-control" th:field="*{cargo}" maxlength="100"/>
                            </div>
                            <div class="col-md-6"><label class="form-label" for="antiguedadMeses">Antigüedad (meses)</label>
                                <input id="antiguedadMeses" class="form-control" type="number" min="0" th:field="*{antiguedadMeses}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('antiguedadMeses')}" th:errors="*{antiguedadMeses}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="ingresosMensuales">Ingresos mensuales (S/)</label>
                                <input id="ingresosMensuales" class="form-control" type="number" min="0" step="0.01" th:field="*{ingresosMensuales}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('ingresosMensuales')}" th:errors="*{ingresosMensuales}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="gastosMensuales">Gastos mensuales (S/)</label>
                                <input id="gastosMensuales" class="form-control" type="number" min="0" step="0.01" th:field="*{gastosMensuales}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('gastosMensuales')}" th:errors="*{gastosMensuales}">
                                </div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="deudasMensuales">Deudas mensuales (S/)</label>
                                <input id="deudasMensuales" class="form-control" type="number" min="0" step="0.01" th:field="*{deudasMensuales}"/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('deudasMensuales')}" th:errors="*{deudasMensuales}">
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button class="btn btn-primary" type="submit">Guardar cliente</button>
                            <a class="btn btn-secondary" th:href="@{/clientes}">Cancelar</a></div>
                    </form>
                </main>
            </div>
        </div>
    </body>
</html>
