<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración crediticia</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-primary px-4"><a class="navbar-brand" th:href="@{/dashboard}">Sistema Crediticio · Administración</a><a class="btn btn-sm btn-outline-light" th:href="@{/logout}">Salir</a></nav><main class="container py-4"><div class="d-flex gap-2 mb-4 flex-wrap"><a class="btn btn-outline-secondary" th:href="@{/politicas}">Políticas</a><a class="btn btn-outline-secondary" th:href="@{/tipos-credito}">Tipos de crédito</a><a class="btn btn-outline-secondary" th:href="@{/politicas/auditoria}">Auditoría</a></div>
<h1 class="h3">Catálogo de tipos de crédito</h1><p class="text-muted">Solo se ofrecen a clientes los tipos activos que además cuentan con una política activa.</p>
<a class="btn btn-primary mb-3" th:href="@{/tipos-credito/nuevo}">+ Nuevo tipo de crédito</a>
<div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
<table class="table table-striped table-hover"><thead><tr><th>Código</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="tipo : ${tipos}"><td th:text="${tipo.codigo}"></td><td th:text="${tipo.nombre}"></td><td th:text="${tipo.descripcion}"></td>
<td th:text="${tipo.activo ? 'Activo' : 'Inactivo'}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/tipos-credito/editar/{id}(id=${tipo.id})}">Editar</a>
<form method="post" th:action="@{/tipos-credito/desactivar/{id}(id=${tipo.id})}" class="d-inline"><button class="btn btn-sm btn-outline-danger" th:if="${tipo.activo}" type="submit">Desactivar</button></form></td></tr></tbody></table>
</main><script th:src="@{/js/json-forms.js(v=2)}" defer></script></body></html>
